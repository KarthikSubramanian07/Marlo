name: CI

on:
  push:
    branches: [main]
  pull_request:
  merge_group:

# A slow pipeline gets bypassed and becomes worthless, so superseded runs are
# cancelled rather than queued.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# Least privilege by default. Jobs that need more say so themselves.
permissions:
  contents: read

env:
  # Turn off the interactive noise and the update nag. Both slow CI and neither
  # tells anyone anything.
  CI: 'true'
  DO_NOT_TRACK: '1'
  PNPM_HOME: ${{ github.workspace }}/.pnpm

jobs:
  # One job installs and caches; everything else reuses it. Splitting into a
  # matrix of installs would triple the network time for no signal.
  static:
    name: Typecheck, lint, format
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # check-signoff needs the branch's commits, not a single squashed one.
          fetch-depth: 0

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm run typecheck

      - name: Lint
        run: pnpm run lint:code

      - name: Architecture rules
        # DECISIONS.md D-008: @marlo/rules must not be able to see its peers.
        # This is the job that enforces it.
        run: pnpm run lint:deps

      - name: Format
        run: pnpm run format:check

  claims:
    name: Claims and prose
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc

      - name: Forbidden claims
        # Every claim Marlo is not entitled to make, anywhere in the
        # repository including generated output. The list lives in
        # scripts/lib/rule-data.mjs, which is the one file the scanner skips,
        # because a checker cannot scan the file defining the phrase it
        # forbids. No suppression comment exists, by design.
        run: node scripts/check-claims.mjs

      - name: Prose rules
        run: node scripts/check-prose.mjs

      - name: No sync-tool duplicates
        run: node scripts/check-no-duplicates.mjs

  corpus:
    name: Corpus is unmodified
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc

      - name: Verify digests and totals
        # The corpus is the ground truth for every accuracy number Marlo
        # publishes. If a test case could be edited, an inconvenient result
        # could be made convenient by changing the question rather than the
        # answer, and nothing downstream would notice. No network: the corpus
        # is vendored, per DECISIONS.md D-012.
        # node directly rather than through pnpm. This job installs no
        # dependencies and the script needs none, and the first version called
        # `pnpm run corpus:verify` in a job with no pnpm, which failed with
        # "pnpm: command not found". A check that cannot fail for the reason it
        # exists is worse than no check.
        run: node scripts/verify-act-corpus.mjs

  test:
    name: Test (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # The floor from package.json engines, and current, so a break on either
        # side is visible.
        node: ['22.13.0', '24']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Unit tests
        # No network, no API keys, no browser binary. If this needs any of them,
        # that is the bug.
        run: pnpm vitest run --project unit

  e2e:
    name: End to end (real files, real process)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build
        # The end to end suite runs the compiled binary through a real pipe, so
        # it needs dist. Everything else in it imports source through Vitest's
        # workspace aliases.
        run: pnpm run build

      - name: Golden files match
        # Two of the three defects in HONESTY.md were found by a real file and a
        # real process, and neither would have been caught by a unit test. This
        # is the job that keeps that true: it asserts 31 rules fire on
        # apps/demo, zero adapters crash, no peer failure is swallowed, and
        # `--json` through a pipe still parses.
        run: pnpm run test:e2e

  coverage:
    name: Coverage thresholds
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Coverage
        # The global figure is 85/80/85/85 and is defensible rather than round;
        # the reasoning is in CONTRIBUTING.md. The per-path overrides matter
        # more: @marlo/act and the one-directional invariant are held at 100,
        # because an uncovered branch in either is an unmeasured accuracy claim
        # or a path where Marlo reports clean while a peer reported a failure.
        # The thresholds live in vitest.config.ts, so this job fails on its own
        # without a flag here.
        run: pnpm run test:coverage

  dogfood:
    name: Marlo's own site passes Marlo's own bar
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Add Playwright, for this job only
        # Playwright is deliberately not a declared dependency: SETUP.md says a
        # browser is optional and `pnpm check` needs none, and a devDependency
        # would make that sentence untrue for everybody who clones the
        # repository. It is installed here, in the one job that needs a real
        # browser, and the lockfile it writes is thrown away with the runner.
        #
        # No --no-frozen-lockfile: that is an `install` flag and `pnpm add`
        # rejects it, which is how the first version of this job failed.
        run: |
          pnpm add -D -w playwright@1.62.0
          pnpm exec playwright install --with-deps chromium

      - name: Build the site
        run: pnpm run site:build

      - name: Audit every page at three widths in both colour schemes
        # The hard gate. Marlo has no standing to report a violation it ships,
        # so this job fails the build on any critical or serious axe violation,
        # any horizontal overflow, and any tap target under 24 CSS pixels.
        #
        # It has to run in a browser because contrast needs layout. The 27 site
        # tests read markup and CSS and cannot see a composited colour, which is
        # how a 2.18:1 failure and a 4.22:1 failure both shipped past them. See
        # HONESTY.md.
        run: pnpm run screenshots

      - name: Keep the audit output even when it fails
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: site-audit
          path: docs/screenshots/
          retention-days: 14

  action:
    name: The Action, run against this repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # The narrowest set that does the work, which is also what check-scopes.mjs enforces.
    # A job here with contents: write would be refused by the action's own first step.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build

      - name: Scan the deliberately broken demo pages
        id: broken
        continue-on-error: true
        uses: ./.github/actions/marlo
        with:
          files: 'apps/demo/checkout.html apps/demo/settings.html'
          fail-on: 'serious'
          sarif-file: 'marlo.sarif'

      - name: The demo pages must fail the Action
        # An action that passes on apps/demo is an action that is not looking. This is the
        # assertion that the composite steps are wired together, not just that they parse.
        run: |
          set -euo pipefail
          if [ "${{ steps.broken.outcome }}" != "failure" ]; then
            echo "The Action passed on pages built to break 31 rules. It is not working."
            exit 1
          fi
          echo "findings: ${{ steps.broken.outputs.findings }}"
          echo "not evaluated: ${{ steps.broken.outputs.not-evaluated }}"
          echo "coverage: ${{ steps.broken.outputs.coverage }}"
          test -s marlo.sarif
          node -e "const s=require('./marlo.sarif'); if (s.version!=='2.1.0') throw new Error('not SARIF 2.1.0'); if (!s.runs[0].results.length) throw new Error('no results')"

      - name: Scan a page with nothing wrong with it
        id: clean
        uses: ./.github/actions/marlo
        with:
          files: 'apps/demo/clean.html'
          fail-on: 'serious'

      - name: A clean page must pass, and must still report what was not checked
        run: |
          set -euo pipefail
          test "${{ steps.clean.outputs.findings }}" = "0"
          test "${{ steps.clean.outputs.not-evaluated }}" != "0"

  dco:
    name: DCO sign-off
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc

      - name: Every commit is signed off
        # Marlo uses the DCO rather than a CLA. DECISIONS.md D-001.
        run: |
          node scripts/check-signoff.mjs --range \
            "${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"
