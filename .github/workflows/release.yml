name: Release

# Publishes every package under @trymarlo to npm when a version tag is pushed.
#
# No token is stored anywhere. npm's trusted publishing exchanges this workflow's
# OpenID Connect identity for a one-time credential, and only for packages whose
# settings on npmjs.com name this repository and this file. Every version is
# published with provenance, which links it to the commit and run that built it.
#
# Trusted publishing can only be configured on a package that already exists, so
# the first version of each is published once by hand with `pnpm run release`
# after `npm login`. RELEASING.md has the steps.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    name: Check and publish
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      # Only for the OpenID Connect exchange with npm. Nothing here writes to GitHub.
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # Trusted publishing needs npm 11.5.1 or later, which Node 24 ships.
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build

      - name: Unit tests
        run: pnpm vitest run --project unit

      - name: The tag names the version being published
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          want="${GITHUB_REF_NAME#v}"
          have="$(node -p "require('./packages/cli/package.json').version")"
          echo "tag $want, packages $have"
          test "$want" = "$have"

      - name: Pack, install, smoke-test, publish what is new
        run: node scripts/release.mjs
