name: Regenerate published artifacts

# The calibration table and the golden files are generated, not written. Regenerating
# them needs a build, the whole corpus and a full end to end run, which is minutes of
# disk-bound work. This runs it on a runner and commits the result to the branch it was
# dispatched on, so a contributor whose machine cannot do it in reasonable time is not
# blocked, and so the numbers always come from the harness rather than from an edit.
#
# It never runs on main and it never runs on a schedule. It is dispatched deliberately,
# on a branch, and the pull request checks then grade whatever it produced exactly as
# they would grade a hand-run regeneration.
#
# The `renderer` input chooses which table is regenerated. `static` rewrites
# calibration/table.json, README.md and tests/golden. `browser` installs Playwright the
# same way the CI browser job does, rewrites calibration/browser.json and BROWSER.md, and
# regenerates tests/golden/browser. The two are separate files because the two renderers
# measure different things, and a run with one never touches the other's output.

on:
  workflow_dispatch:
    inputs:
      renderer:
        description: 'Which renderer to measure with'
        required: true
        default: static
        type: choice
        options:
          - static
          - browser

permissions:
  contents: write

concurrency:
  group: regenerate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regenerate:
    name: Regenerate the table and the golden files
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      # Read through the environment rather than substituted into a shell line, for the
      # same reason the branch name is below: an input is text that bash would otherwise
      # see as code. This one is a choice with two values, and it stays data anyway.
      RENDERER: ${{ inputs.renderer }}
    steps:
      - name: Refuse to run anywhere but a branch that is not main
        # Not only `refs/heads/main`. A dispatch on a tag gives `refs/tags/v1`, which the
        # main-only test lets through, and this job would then commit against a detached
        # tag ref.
        if: github.ref == 'refs/heads/main' || !startsWith(github.ref, 'refs/heads/')
        run: |
          echo "This writes generated files. Dispatch it on a branch, never on main" >&2
          echo "and never on a tag. Got: $GITHUB_REF" >&2
          exit 1

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.ref_name }}

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Add Playwright, for the browser renderer only
        # Exactly what the CI browser job does, and for the same reason it is not a
        # devDependency: `pnpm check` must stay green with no browser installed. The
        # package.json and lockfile edits this makes are reverted before the commit below,
        # so a regeneration never turns Playwright into a dependency of the repository.
        if: inputs.renderer == 'browser'
        run: |
          pnpm add -D -w playwright@1.62.0
          pnpm exec playwright install --with-deps chromium

      - name: Build
        # The harness and the CLI run from dist, and the browser path injects two bundles
        # the build writes there.
        run: pnpm run build

      - name: Regenerate the calibration table
        run: node packages/calibrate/dist/bin.js --renderer "$RENDERER"

      - name: Regenerate the static golden files
        if: inputs.renderer == 'static'
        env:
          UPDATE_GOLDEN: '1'
        run: pnpm run test:e2e

      - name: Regenerate the browser golden files
        if: inputs.renderer == 'browser'
        env:
          UPDATE_GOLDEN: '1'
        run: pnpm run test:browser

      - name: Put Playwright back where it was
        # The browser job above added it to package.json and the lockfile. Those two files
        # must not be committed with it, so they are restored before anything is staged.
        if: inputs.renderer == 'browser'
        run: git checkout -- package.json pnpm-lock.yaml

      - name: Format, because prettier owns the markdown table
        run: pnpm run format

      - name: Show what moved
        run: git --no-pager diff --stat

      - name: Commit, only if something actually changed
        run: |
          if git diff --quiet && [ -z "$(git ls-files --others --exclude-standard)" ]; then
            echo "Nothing to regenerate. The committed artifacts already match the harness."
            exit 0
          fi
          git config user.name "KarthikSubramanian07"
          git config user.email "winnerkarthik07@gmail.com"
          git add -A
          # The pre-commit hook lints the staged files, and every file staged here is
          # generated output that CI is about to lint anyway. Leaving the hook in place
          # means an unrelated lint error in the source blocks a regeneration that
          # succeeded, which is what happened the first time this ran.
          git commit -sn -m "calibrate: regenerate the $RENDERER table and golden output on a runner

          Produced by .github/workflows/regenerate.yml rather than by hand, so the
          published numbers come from the harness. The diff is in the job log."
          # --no-verify for the same reason as the commit above: the pre-push hook runs
          # typecheck and the unit suite, which the pull request checks run again on the
          # very next event. A hook failing here loses the regeneration and leaves the
          # branch with stale artifacts, which is the state this job exists to fix.
          #
          # The ref comes from the environment rather than from an Actions expression,
          # because an expression is substituted as text before bash sees the line, which
          # makes a branch name code:
          # git permits `$`, backtick, `;`, `&` and `|` in a ref, and `${IFS}` supplies
          # the spaces it forbids. A branch called `x$(...)` would have run its contents
          # on a runner holding a token with write access. Reading `$GITHUB_REF_NAME`
          # and quoting it keeps the name data.
          #
          # `refs/heads/` is explicit because a bare `HEAD:name` resolves against every
          # namespace, and a dispatch on a tag would otherwise push into `refs/tags`.
          git push --no-verify origin "HEAD:refs/heads/$GITHUB_REF_NAME"
