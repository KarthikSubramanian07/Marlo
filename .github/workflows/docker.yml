name: Container image

# Publishes the marlo command line as ghcr.io/karthiksubramanian07/marlo, for anybody
# who wants to run a scan with nothing installed but Docker. Built on every change to
# main, tagged `latest` and with the commit. A pull request builds the image and runs it
# against the demo pages without pushing, so a broken Dockerfile cannot merge.

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - Dockerfile
      - .dockerignore
      - .github/workflows/docker.yml
      - 'packages/**'
      - pnpm-lock.yaml
  workflow_dispatch:

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  image:
    name: Build, smoke-test and publish
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      # Only to push the image. Nothing else in this job writes.
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build for this runner, to test before anything is pushed
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: marlo:test

      - name: The broken demo must fail and the clean one must pass
        run: |
          set +e
          docker run --rm -v "$PWD/apps/demo:/work" marlo:test scan checkout.html > /dev/null
          broken=$?
          docker run --rm -v "$PWD/apps/demo:/work" marlo:test scan clean.html > /dev/null
          clean=$?
          set -e
          echo "checkout.html exited $broken, clean.html exited $clean"
          test "$broken" -eq 1
          test "$clean" -eq 0

      - name: Tags
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository_owner }}/marlo
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=long
          labels: |
            org.opencontainers.image.title=marlo
            org.opencontainers.image.description=Accessibility checker that publishes its own error rate. The command line, static renderer.
            org.opencontainers.image.licenses=MIT

      - name: Sign in to the GitHub container registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish for amd64 and arm64
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
