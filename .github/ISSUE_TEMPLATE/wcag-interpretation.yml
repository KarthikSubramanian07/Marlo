name: WCAG interpretation question
description: A question about what a success criterion actually requires.
title: 'wcag: '
labels: ['type:wcag-interpretation', 'needs:human-judgment']
body:
  - type: markdown
    attributes:
      value: |
        These are welcome and they are not support questions. Marlo has to take a position on
        ambiguous criteria in order to be a program at all, and the positions should be visible and
        arguable rather than buried in a conditional.

        Answers that change behaviour end up in DECISIONS.md. Answers that change wording end up in
        the rule's own documentation.
  - type: input
    id: criterion
    attributes:
      label: Success criterion
      placeholder: 2.4.4 Link Purpose (In Context)
    validations:
      required: true
  - type: textarea
    id: question
    attributes:
      label: The question
    validations:
      required: true
  - type: textarea
    id: marlos-position
    attributes:
      label: What Marlo currently does, if you know
      description: The rule identifier or the output is enough.
    validations:
      required: false
